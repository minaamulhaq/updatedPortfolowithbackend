name: Deploy Portfolio

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Build Docker images locally on GitHub Runner
    - name: Build Docker Images
      run: |
        docker build \
          --build-arg NEXT_PUBLIC_API_URL=/api \
          -t portfolio-frontend:latest ./client

        docker build -t portfolio-backend:latest ./backend

    # Save images to a compressed tarball
    - name: Save Docker Images
      run: |
        docker save portfolio-frontend:latest portfolio-backend:latest | gzip > deploy_images.tar.gz

    # Copy the images and compose file to the VPS
    - name: Copy Files to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        port: 22
        source: "deploy_images.tar.gz,docker-compose.yml"
        target: "/var/www/myapp"

    # Deploy on VPS
    - name: Deploy on VPS
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_KEY }}
        port: 22
        script: |
          cd /var/www/myapp
          
          # Load the new images into Docker
          echo "Loading Docker images..."
          docker load < deploy_images.tar.gz
          
          # Restart the containers using the newly loaded images
          docker compose down
          docker compose up -d
          
          # Clean up to save space
          rm deploy_images.tar.gz
          docker image prune -f