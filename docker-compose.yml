version: "3.8"

services:
  backend:
    image: portfolio-backend:latest
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend:
    image: portfolio-frontend:latest
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: "/api"
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend